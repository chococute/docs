<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(135deg, #f8f4ff, #eef6ff); color: #252134; }
    main { width: min(680px, calc(100% - 48px)); padding: 48px; border-radius: 28px; background: rgba(255,255,255,.8); box-shadow: 0 20px 60px rgba(77,62,116,.14); }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 4.5rem); }
    p { margin: 0; font-size: 1.1rem; line-height: 1.7; color: #655d75; }
    @media (prefers-color-scheme: dark) { body { background: #17151d; color: #fff; } main { background: #24212d; } p { color: #c8bfd6; } }
  </style>
</head>
<body>
  <main>
    <h1>Docs</h1>
    <p>문서 사이트를 준비하고 있어요.</p>
  </main>
</body>
</html>
